<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TreinaAi - Alunos Inscritos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-horarios {
            width: 600px;
        }
        .agendamento-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .status-confirmado {
            color: #27ae60;
            font-weight: bold;
        }
        .status-cancelado {
            color: #e74c3c;
            font-weight: bold;
        }
        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-sair {
            background: none;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            width: auto;
            padding: 6px 12px;
        }
    </style>
</head>
<body>
    <div class="container container-horarios">
        <div class="topo">
            <h1>TreinaAi</h1>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>

        <p><a href="horarios.html">← Voltar para horários</a></p>

        <h2>Alunos inscritos</h2>
        <div id="lista-agendamentos">
            <p>Carregando...</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        carregarAgendamentosProfessor();
    </script>
</body>
</html>
