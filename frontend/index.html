<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TreinaAi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="tela-autenticacao" class="container">
            <h1>TreinaAi</h1>

            <div id="form-login">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-senha" placeholder="Senha">
                <button onclick="fazerLogin()">Entrar</button>
                <p>Não tem conta? <a href="#" onclick="mostrarCadastro()">Cadastre-se</a></p>
            </div>

            <div id="form-cadastro" style="display: none;">
                <h2>Cadastro</h2>
                <input type="text" id="cadastro-nome" placeholder="Nome">
                <input type="email" id="cadastro-email" placeholder="Email">
                <input type="password" id="cadastro-senha" placeholder="Senha">
                <button onclick="fazerCadastro()">Cadastrar</button>
                <p>Já tem conta? <a href="#" onclick="mostrarLogin()">Fazer login</a></p>
            </div>
        </section>

        <section id="tela-horarios" class="container container-horarios" style="display: none;">
            <div class="topo">
                <h1>TreinaAi</h1>
                <button class="btn-sair" onclick="sair()">Sair</button>
            </div>

            <p>Olá, <strong id="nome-usuario"></strong>!</p>
            <div id="link-professor" style="display: none;">
                <p><a href="#" onclick="mostrarTelaProfessor()">Ver alunos inscritos nos meus horários</a></p>
            </div>

            <h2>Horários disponíveis</h2>
            <div id="lista-horarios">
                <p>Carregando...</p>
            </div>

            <h2>Meus agendamentos</h2>
            <div id="lista-meus-agendamentos">
                <p>Carregando...</p>
            </div>
        </section>

        <section id="tela-professor" class="container container-horarios" style="display: none;">
            <div class="topo">
                <h1>TreinaAi</h1>
                <button class="btn-sair" onclick="sair()">Sair</button>
            </div>

            <p><a href="#" onclick="mostrarTelaHorarios()">← Voltar para horários</a></p>
            <h2>Alunos inscritos</h2>
            <div id="lista-agendamentos">
                <p>Carregando...</p>
            </div>
        </section>
    </main>

    <div id="modal-agendar" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Escolha a data</h3>
            <input type="date" id="input-data" lang="pt-BR">
            <button onclick="confirmarAgendamento()">Confirmar</button>
            <button onclick="fecharModal()" class="btn-cancelar">Cancelar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        inicializarAplicacao();
    </script>
</body>
</html>
